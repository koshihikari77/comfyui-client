[tool:pytest]
# テストディレクトリの指定
testpaths = tests

# テストファイルの発見パターン
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ログレベルの設定
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告の制御
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# マーカーの定義
markers =
    unit: ユニットテスト
    integration: 統合テスト
    slow: 実行時間の長いテスト
    mock: モックサービスを使用するテスト

# カバレッジ設定
addopts = 
    --cov=core
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    -v
    --tb=short 